# CHIM OStim Bridge - builds the mod on GitHub and publishes releases on Nexus Mods.
#
# Every push and pull request: the whole mod is built from source (tools/build_linux.sh:
# plugin, Papyrus scripts, CHIM server package, FOMOD archive) and the archive is kept as
# the run's artifact "CHIM OStim Bridge" - download it from the run to test a build.
#
# Publishing a GitHub release from a tag (v1.2.0): the tagged commit is built the same
# way, its version must match the tag, the archive is attached to the release and
# uploaded to Nexus Mods as a new version of the main file; the previous version moves
# to "Old versions", the mod's version is updated and the release text becomes the
# changelog (official action Nexus-Mods/upload-action, Upload API). Actions -> Run
# workflow with a tag retries the publishing of an existing release.
#
# The Papyrus compiler is the open-source papyrus-compiler (MIT), built here from source
# at a pinned commit with the V version its own release workflow uses; it type-checks
# against the declaration-only headers in stubs/, so no game files are needed.
# Needs for publishing: environment "Nexus" with the secret NEXUSMODS_API_KEY (personal
# API key from nexusmods.com/settings/api-keys).

name: Build and publish

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish an existing release again, e.g. v1.2.0 (empty: only build)"
        required: false

permissions:
  contents: read

env:
  MOD_ID: "194761"     # nexusmods.com/skyrimspecialedition/mods/194761
  FILE_ID: "820230"    # the main file "CHIM OStim Bridge"; new versions are added to it
  ARCHIVE: "dist/CHIM OStim Bridge.zip"
  # papyrus-compiler master with the string escape fix (issue 19), after release 0.0.4
  PAPYRUS_COMPILER_COMMIT: b9dc9951f4264084c8ded6721b20f0d81c021d58
  V_VERSION: "0.5.1"
  V_SHA256: 0c35c79343b308e0415619d8e6d8da340c6a24c18331123553cc686ffb18abf4

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Which tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}

      - name: Papyrus compiler from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/papyrus-compiler
          key: papyrus-compiler-${{ env.PAPYRUS_COMPILER_COMMIT }}-v${{ env.V_VERSION }}

      - name: Build the Papyrus compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o v.zip "https://github.com/vlang/v/releases/download/$V_VERSION/v_linux.zip"
          echo "$V_SHA256  v.zip" | sha256sum -c -
          unzip -q v.zip
          git clone --quiet https://github.com/russo-2025/papyrus-compiler.git pc
          git -C pc checkout --quiet "$PAPYRUS_COMPILER_COMMIT"
          (cd pc && ../v/v -prod -gc none -o bin/papyrus-compiler compiler.v)
          mkdir -p ~/papyrus-compiler
          cp pc/bin/papyrus-compiler ~/papyrus-compiler/

      - name: Build the mod
        run: |
          ~/papyrus-compiler/papyrus-compiler version
          bash tools/build_linux.sh ~/papyrus-compiler/papyrus-compiler dist

      - name: Version matches the tag
        if: steps.tag.outputs.tag != ''
        run: |
          FOUND=$(unzip -p "$ARCHIVE" fomod/info.xml | grep -o 'MachineVersion="[^"]*"' | cut -d'"' -f2)
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$FOUND" != "${TAG#v}" ]; then
            echo "::error::the mod is version $FOUND, the tag is $TAG"; exit 1
          fi
          echo "version $FOUND OK"

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: CHIM OStim Bridge
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: Nexus
    permissions:
      contents: write  # attach the archive to the release
    steps:
      - name: Get the archive
        uses: actions/download-artifact@v4
        with:
          name: CHIM OStim Bridge
          path: dist

      - name: Release notes as the Nexus changelog
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(gh release view "${{ needs.build.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          # plain lines for Nexus: no markdown headings, bold or links
          CLEAN=$(printf '%s\n' "$BODY" | sed -E 's/^#+ *//; s/\*\*//g; s/\[([^]]*)\]\([^)]*\)/\1/g')
          {
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$CLEAN"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the archive to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.build.outputs.tag }}" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Version for Nexus
        id: version
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.MOD_ID }}
          file_id: ${{ env.FILE_ID }}
          filename: ${{ env.ARCHIVE }}
          version: ${{ steps.version.outputs.version }}
          display_name: CHIM OStim Bridge
          description: "FOMOD installer; the CHIM server plugin installs and updates itself at game start. Source and build instructions: https://github.com/SimpleL97/CHIM-OStim-Bridge"
          category: main
          archive_existing_version: true
          update_mod_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          changelog: ${{ steps.notes.outputs.changelog }}
